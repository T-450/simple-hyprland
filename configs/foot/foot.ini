# Simple Hyprland Foot settings, tuned for the 1920x1080 eDP panel at 1.5x scale.
[main]
term=xterm-256color
font=SauceCodePro Nerd Font:size=10
pad=14x14
initial-window-mode=windowed
workers=0

[scrollback]
lines=10000
multiplier=7.0

[key-bindings]
clipboard-copy=Control+Insert Control+Shift+c XF86Copy
primary-paste=none
clipboard-paste=Shift+Insert Control+Shift+v XF86Paste

[text-bindings]
# Send Shift+Return as CSI-u so TUIs can distinguish it from Return.
\x1b[13;2u=Shift+Return
# Send Alt+Shift+Return as CSI-u so tmux can match M-S-Enter.
\x1b[13;4u=Mod1+Shift+Return

[cursor]
style=beam
blink=no

[colors-dark]
alpha=1.0
foreground=cccccc
background=222222

regular0=353535
regular1=ff8080
regular2=22ee55
regular3=f7a41d
regular4=6688ff
regular5=b1a0f8
regular6=21edba
regular7=cccccc

bright0=808080
bright1=ff8080
bright2=22ee55
bright3=f7a41d
bright4=6688ff
bright5=b1a0f8
bright6=21edba
bright7=eeeeee

cursor=222222 eeeeee
selection-foreground=222222
selection-background=6688ff
search-box-no-match=222222 ff8080
search-box-match=222222 b1a0f8
jump-labels=222222 f7a41d
urls=21edba
